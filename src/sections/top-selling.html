<section id="Bestsellers" class="top-selling-section">
  <div class="container">
    <h2 class="title">Top-Selling Bouquets</h2>
    <div class="swiper gallery-swiper">
      <ul class="swiper-wrapper">
      </ul>

      <div class="gallery-nav">
        <div class="swiper-pagination gallery-dots"></div>
        <div class="arrows">
          <button
            class="animated-arrow-button swiper-button-prev"
            id="swiper-button-prev"
            aria-label="Show previous bouquet"
            type="button"
          >
            <svg class="arrow icon-arrow-left" width="48" height="48">
              <use href="./symbol-defs.svg#icon-left-arrow-alt"></use>
            </svg>
          </button>
          <button
            class="animated-arrow-button swiper-button-next"
            id="swiper-button-next"
            aria-label="Show next bouquet"
            type="button"
          >
            <svg class="arrow icon-arrow-right" width="48" height="48">
              <use href="./symbol-defs.svg#icon-right-arrow-alt"></use>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>
</section>
