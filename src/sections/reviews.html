<section id="Feedback" class="reviews-section">
  <div class="container">
    <h2 class="title">What our clients says</h2>
    <div class="swiper reviews-swiper">
      <ul class="swiper-wrapper">
        <!-- заповнюється через JS -->
      </ul>
      <div class="reviews-nav">
        <button id="swiper-button-prev" class="animated-arrow-button swiper-button-prev" aria-label="Show previous review" type="button">
          <svg class="arrow icon-arrow-left" width="48" height="48">
            <use href="./symbol-defs.svg#icon-left-arrow-alt"></use>
          </svg>
        </button>
        <button id="swiper-button-next" class="animated-arrow-button swiper-button-next" aria-label="Show next review" type="button">
          <svg class="arrow icon-arrow-right" width="48" height="48">
            <use href="./symbol-defs.svg#icon-right-arrow-alt"></use>
          </svg>
        </button>
      </div>
    </div>
  </div>
</section>
