<section id="Bouquets" class="bouquets-section">
  <div class="container">
    <h2 class="title">Bouquets</h2>
    <p class="subtitle">
      Explore our stunning selection of fresh flower bouquets.
    </p>
    <ul class="list-container" id="main-bouquets-list">
    </ul>
    <div id="bouquets-empty" class="empty-message hidden">
      <p>No bouquets available.</p>
    </div>
    <div id="bouquets-error" class="error-message hidden">
      <p>Failed to load bouquets.</p>
    </div>
    <button class="button animated-button" id="load-more-btn" aria-label="Show more bouquets" type="button">Show More</button>
  </div>
</section>
